[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-bootstrap"
version = "0.7.0"
description = "Reference bootstrap toolchain for the S3 balanced-ternary language"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "S3 contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[project.scripts]
s3 = "bootstrap.s3.cli:main"

[tool.setuptools.packages.find]
include = ["bootstrap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "s3_fast: deterministic first-response correctness capability",
    "s3_contract: explicit compiler, IR, optimizer, ABI, frame, renderer, or backend contract",
    "s3_differential: semantic comparison across execution or compilation modes",
    "s3_native: requires native compilation, assembly, linking, or native execution",
    "s3_slow: deliberately expensive or stress-oriented correctness test",
    "s3_benchmark: s3bench infrastructure and schema correctness test",
]
