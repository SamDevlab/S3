name: Stage1 F27 Review

on:
  push:
    branches:
      - 'review/chatgpt-stage1-f27-compound-while-fix-20260906'
    paths:
      - 'review_snapshot_post_f27_fix/**'
      - 'tests/test_stage1_f27_patch_proposal.py'
      - 'tests/test_stage1_local_closure_matrix.py'
      - '.github/workflows/stage1-f27-review.yml'
  pull_request:
    paths:
      - 'review_snapshot_post_f27_fix/**'
      - 'tests/test_stage1_f27_patch_proposal.py'
      - 'tests/test_stage1_local_closure_matrix.py'
      - '.github/workflows/stage1-f27-review.yml'
  workflow_dispatch:

jobs:
  focused-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      S3_STAGE1_LOCAL_CLOSURE: '1'
      S3_STAGE1_CANONICAL_PATH: /tmp/s3c_stage1_protected.s3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize protected canonical from pinned commit
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 1ec76af89992f119865a370488593ad5c85c4c49
          git show 1ec76af89992f119865a370488593ad5c85c4c49:selfhost/compiler/s3c_stage1.s3 > "$S3_STAGE1_CANONICAL_PATH"
          test "$(wc -c < "$S3_STAGE1_CANONICAL_PATH")" -eq 225699
          test "$(sha256sum "$S3_STAGE1_CANONICAL_PATH" | awk '{print $1}')" = "44f022820a9191e3a6d402c188eb4b242e0ffeefd7a149b15e2b46039031b9cb"
      - name: Install project
        run: python -m pip install -e .
      - name: Run focused Stage1 proposal tests
        id: focused
        shell: bash
        run: |
          set +e
          python -m pytest -vv -s tests/test_stage1_f27_patch_proposal.py tests/test_stage1_local_closure_matrix.py > stage1-f27-review.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat stage1-f27-review.log
          exit 0
      - name: Upload focused log
        uses: actions/upload-artifact@v4
        with:
          name: stage1-f27-review-log
          path: stage1-f27-review.log
          if-no-files-found: error
      - name: Enforce focused result
        shell: bash
        run: exit "${{ steps.focused.outputs.exit_code }}"
