name: Stage1 F27 Review

on:
  pull_request:
    paths:
      - 'review_snapshot_post_f27_fix/**'
      - 'tests/test_stage1_f27_patch_proposal.py'
      - 'tests/test_stage1_local_closure_matrix.py'
      - '.github/workflows/stage1-f27-review.yml'
  workflow_dispatch:

jobs:
  focused-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e .
      - name: Run focused Stage1 proposal tests
        id: focused
        shell: bash
        run: |
          set +e
          python -m pytest -vv -s tests/test_stage1_f27_patch_proposal.py tests/test_stage1_local_closure_matrix.py > stage1-f27-review.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat stage1-f27-review.log
          exit 0
      - name: Upload focused log
        uses: actions/upload-artifact@v4
        with:
          name: stage1-f27-review-log
          path: stage1-f27-review.log
          if-no-files-found: error
      - name: Enforce focused result
        shell: bash
        run: exit "${{ steps.focused.outputs.exit_code }}"
