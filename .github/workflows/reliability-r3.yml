name: S3 1.1 R3 reliability evidence

on:
  workflow_dispatch:
    inputs:
      case_count:
        description: Total deterministic valid cases
        required: true
        default: "128"
      native_case_count:
        description: First-N cases also executed through Linux x86-64 native O0/O1
        required: true
        default: "16"

permissions:
  contents: read

jobs:
  r3-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install S3 test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,crypto]"

      - name: Focused Reliability Lab v2 tests
        run: |
          python -m pytest -q \
            tests/test_reliability_contract_v2.py \
            tests/test_reliability_runner_v2.py \
            tests/test_reliability_generator_v2.py \
            tests/test_reliability_differential_v2.py \
            tests/test_reliability_worker_r3.py \
            tests/test_reliability_campaign_v2.py

      - name: Execute bounded R3 hosted/native campaign
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          mkdir -p reports-local/r3/replays
          python tools/reliability_campaign_v2.py \
            --id "r3-github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --seed 20260915 \
            --cases "${{ inputs.case_count }}" \
            --native-cases "${{ inputs.native_case_count }}" \
            --expect-head "$HEAD_SHA" \
            --report reports-local/r3/campaign.json \
            --replay-root reports-local/r3/replays

      - name: Upload R3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-r3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports-local/r3
          if-no-files-found: warn
          retention-days: 30
