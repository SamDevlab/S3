name: Stage1 Semantic IR Reference

on:
  push:
    branches:
      - parallel/pr268-semantic-lowering-v1-20260827
    paths:
      - "tools/stage1_semantic_ir_reference.py"
      - "tools/stage1_semantic_stream_protocol.py"
      - "tools/stage1_semantic_stream_v2.py"
      - "tools/verify_stage1_semantic_conformance_v2.py"
      - "tools/stage1_source_binding_reference.py"
      - "tools/patch_stage1_semantic_port_v1.py"
      - "tools/audit_stage1_semantic_port_v1.py"
      - "selfhost/compiler/stage1_semantic_stream_v1.s3"
      - "selfhost/compiler/stage1_semantic_stream_v2.s3"
      - "tests/test_stage1_semantic_ir_reference.py"
      - "tests/test_stage1_semantic_stream_v1.py"
      - "tests/test_stage1_semantic_stream_protocol.py"
      - "tests/test_stage1_semantic_stream_v2.py"
      - "tests/test_stage1_source_binding_reference.py"
      - "tests/test_patch_stage1_semantic_port_v1.py"
      - "reports/selfhost/stage1/semantic-ir-v1-contract.json"
      - "reports/selfhost/stage1/semantic-ir-v2-handoff-contract.json"
      - ".github/workflows/stage1-semantic-reference.yml"
  pull_request:
    paths:
      - "tools/stage1_semantic_ir_reference.py"
      - "tools/stage1_semantic_stream_protocol.py"
      - "tools/stage1_semantic_stream_v2.py"
      - "tools/verify_stage1_semantic_conformance_v2.py"
      - "tools/stage1_source_binding_reference.py"
      - "tools/patch_stage1_semantic_port_v1.py"
      - "tools/audit_stage1_semantic_port_v1.py"
      - "selfhost/compiler/stage1_semantic_stream_v1.s3"
      - "selfhost/compiler/stage1_semantic_stream_v2.s3"
      - "tests/test_stage1_semantic_ir_reference.py"
      - "tests/test_stage1_semantic_stream_v1.py"
      - "tests/test_stage1_semantic_stream_protocol.py"
      - "tests/test_stage1_semantic_stream_v2.py"
      - "tests/test_stage1_source_binding_reference.py"
      - "tests/test_patch_stage1_semantic_port_v1.py"
      - "reports/selfhost/stage1/semantic-ir-v1-contract.json"
      - "reports/selfhost/stage1/semantic-ir-v2-handoff-contract.json"
      - ".github/workflows/stage1-semantic-reference.yml"
  workflow_dispatch:

jobs:
  semantic-v2-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile frozen v2 tools
        run: |
          python -m compileall -q \
            tools/stage1_semantic_stream_v2.py \
            tools/verify_stage1_semantic_conformance_v2.py \
            tests/test_stage1_semantic_stream_v2.py
      - name: Validate frozen v2 contract
        run: python -c "import json; json.load(open('reports/selfhost/stage1/semantic-ir-v2-handoff-contract.json', encoding='utf-8'))"
      - name: Run v2 oracle and conformance tests
        run: python -m pytest -q tests/test_stage1_semantic_stream_v2.py
      - name: Stage0 compile v2 S3 emission primitives
        run: python -m bootstrap.s3.cli check selfhost/compiler/stage1_semantic_stream_v2.s3

  python-reference-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile reference tools
        run: |
          python -m compileall -q \
            tools/stage1_semantic_ir_reference.py \
            tools/stage1_semantic_stream_protocol.py \
            tools/stage1_source_binding_reference.py \
            tests/test_stage1_semantic_ir_reference.py \
            tests/test_stage1_semantic_stream_protocol.py \
            tests/test_stage1_source_binding_reference.py
      - name: Validate prototype contract
        run: python -c "import json; json.load(open('reports/selfhost/stage1/semantic-ir-v1-contract.json', encoding='utf-8'))"
      - name: Test reference model
        run: |
          python -m pytest -q \
            tests/test_stage1_semantic_ir_reference.py \
            tests/test_stage1_semantic_stream_protocol.py \
            tests/test_stage1_source_binding_reference.py

  s3-stream-primitives-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Test standalone S3 stream source
        run: python -m pytest -q tests/test_stage1_semantic_stream_v1.py
      - name: Stage0 compile standalone stream source
        run: python -m bootstrap.s3.cli check selfhost/compiler/stage1_semantic_stream_v1.s3

  s1-patcher-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile patch and audit tools
        run: |
          python -m compileall -q \
            tools/patch_stage1_semantic_port_v1.py \
            tools/audit_stage1_semantic_port_v1.py \
            tests/test_patch_stage1_semantic_port_v1.py
      - name: Test deterministic S1 patch
        run: python -m pytest -q tests/test_patch_stage1_semantic_port_v1.py
      - name: Generate candidate
        run: |
          mkdir -p .artifacts
          python tools/patch_stage1_semantic_port_v1.py --output .artifacts/s3c_stage1_semantic_s1.s3
      - name: Audit candidate stays partial
        run: |
          python tools/audit_stage1_semantic_port_v1.py \
            .artifacts/s3c_stage1_semantic_s1.s3 \
            --output .artifacts/semantic-port-audit.json
          python -c "import json; d=json.load(open('.artifacts/semantic-port-audit.json')); assert d['S1_typed_values']['status'] == 'PARTIAL'; assert not d['general_emitter_authorized']"

  generated-stage1-prototype-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: s1-patcher-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate candidate
        run: |
          mkdir -p .artifacts
          python tools/patch_stage1_semantic_port_v1.py --output .artifacts/s3c_stage1_semantic_s1.s3
      - name: Stage0 compile generated Stage1 candidate
        timeout-minutes: 10
        run: python -m bootstrap.s3.cli check .artifacts/s3c_stage1_semantic_s1.s3
