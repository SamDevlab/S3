name: Stage1 Semantic V3 Audit

# PR #271 qualification workflow.
on:
  push:
    branches:
      - audit/stage1-semantic-oracle-v3-20260829
  pull_request:
    paths:
      - "tools/stage1_semantic_stream_v3.py"
      - "tools/verify_stage1_semantic_conformance_v3.py"
      - "tests/test_stage1_semantic_stream_v3.py"
      - "reports/selfhost/stage1/semantic-ir-v3-audit-contract.json"
      - "reports/selfhost/stage1/ORACLE_V2_AUDIT_AND_V3_CORRECTION_20260829.md"
      - ".github/workflows/stage1-semantic-v3-audit.yml"
  workflow_dispatch:

jobs:
  hosted-v3-canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile audited v3 tools
        run: |
          python -m compileall -q \
            tools/stage1_semantic_stream_v3.py \
            tools/verify_stage1_semantic_conformance_v3.py \
            tests/test_stage1_semantic_stream_v3.py
      - name: Validate v3 contract JSON
        run: python -c "import json; json.load(open('reports/selfhost/stage1/semantic-ir-v3-audit-contract.json', encoding='utf-8'))"
      - name: Run independent v3 canaries
        run: python -m pytest -q tests/test_stage1_semantic_stream_v3.py
