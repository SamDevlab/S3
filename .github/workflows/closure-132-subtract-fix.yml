name: M1.32 exact subtraction closure

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/_closure_132_subtract_fix.py
      - .github/workflows/closure-132-subtract-fix.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/closure-1.32-numeric-20260810-1705
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Apply guarded subtraction fix
        run: python tools/_closure_132_subtract_fix.py
      - name: Compile check
        run: python -m compileall -q bootstrap tests
      - name: Targeted exactness and regression proof
        env:
          S3_NATIVE_REQUIRED: '1'
        run: >-
          python -m pytest -q
          tests/test_numeric_closure.py
          tests/test_numeric_capability_e2e.py
          tests/test_compiler.py
          tests/test_s3_static_text_concatenation_ir.py
          tests/test_x86_64_liveness.py
          tests/test_native_x86_64.py
          tests/test_numeric_native_integration.py
          tests/test_numeric_source_parser.py
      - name: Diff check
        run: git diff --check
      - name: Commit validated subtraction fix
        run: |
          rm tools/_closure_132_subtract_fix.py .github/workflows/closure-132-subtract-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(1.32): make machine subtraction exact at i64 boundaries'
          git push origin HEAD:production/closure-1.32-numeric-20260810-1705
