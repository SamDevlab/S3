name: Tests

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - "benchmarks/**"
      - "spec/**"
      - ".gitattributes"
      - "docs/language-maturity-report-v3.md"
      - "docs/language-maturity-matrix-v3.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/ai-capabilities.json"
      - "docs/decisions/**"
      - "docs/diagnostics.md"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "bootstrap/**"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - "benchmarks/**"
      - "spec/**"
      - ".gitattributes"
      - "docs/language-maturity-report-v3.md"
      - "docs/language-maturity-matrix-v3.json"
      - "pyproject.toml"
      - "README.md"
      - "docs/ai-capabilities.json"
      - "docs/decisions/**"
      - "docs/diagnostics.md"
      - ".github/workflows/**"

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ssa-per-pass-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify SSA after each optimization pass
        run: >-
          python -m pytest -q
          tests/test_ssa_per_pass_verification.py
          tests/test_differential_correctness_matrix.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the supported interpreter set explicit for the stabilization contract.
        # The include entries below assign each group to its canonical interpreter.
        # Supported Python versions: ["3.11", "3.12", "3.13"]
        include:
          - python-version: "3.11"
            group_name: unit
            group_filter: 'not (renderer or adapter or fixture_output or benchmark or lehmer or prime)'
          - python-version: "3.12"
            group_name: unit
            group_filter: 'not (renderer or adapter or fixture_output or benchmark or lehmer or prime)'
          - python-version: "3.13"
            group_name: unit
            group_filter: 'not (renderer or adapter or fixture_output or benchmark or lehmer or prime)'
          - python-version: "3.13"
            group_name: renderer
            group_filter: 'renderer or adapter or fixture_output'
          - python-version: "3.13"
            group_name: benchmark
            group_filter: 'benchmark or lehmer or prime'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check golden inspect artifacts
        if: matrix.group_name == 'unit'
        run: python tools/golden_inspect.py check

      - name: Run tests
        run: python -m pytest -n auto -v --tb=short -k "${{ matrix.group_filter }}"

  native-x86-64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate native toolchain
        run: |
          uname -m
          cc --version
          as --version
          ld --version
          file --version
          readelf --version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run required native x86-64 tests
        env:
          S3_NATIVE_REQUIRED: "1"
        run: >-
          python -m pytest
          tests/test_native_x86_64_integration.py
          tests/test_instruction_limit_e3.py
          tests/test_external_jsmn_native.py

  numeric-domain-closure:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate native numeric toolchain
        run: |
          uname -m
          cc --version
          as --version
          ld --version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prove M1.32 programmer-visible numeric capability
        env:
          S3_NATIVE_REQUIRED: "1"
        run: >-
          python -m pytest -q
          tests/test_numeric_domains.py
          tests/test_numeric_closure.py
          tests/test_numeric_source_parser.py
          tests/test_numeric_native_integration.py
          tests/test_numeric_capability_e2e.py

  differential-generated:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic differential gate
        run: >-
          python -m pytest -q
          tests/test_deterministic_differential_generation.py
          tests/test_differential_harness.py

  qbe-oracle-linux:
    runs-on: ubuntu-24.04
    env:
      QBE_SOURCE_URL: git://c9x.me/qbe.git
      QBE_REVISION: c0818978acec60ebb6167fade60fb7012cbf20ca

    steps:
      - name: Check out S3
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Record pinned QBE build host
        run: |
          uname -s
          uname -m
          cc --version | head -n 1
          make --version | head -n 1
          printf 'QBE_SOURCE_URL=%s\nQBE_REVISION=%s\n' "$QBE_SOURCE_URL" "$QBE_REVISION"

      - name: Build pinned QBE outside the repository
        run: |
          set -eu
          source_dir="$RUNNER_TEMP/qbe-source"
          bin_dir="$RUNNER_TEMP/qbe-bin"
          git init "$source_dir"
          if ! git -C "$source_dir" fetch --depth=1 --no-tags "$QBE_SOURCE_URL" "$QBE_REVISION"; then
            echo "QBE_SOURCE_FETCH_FAILURE: $QBE_SOURCE_URL at $QBE_REVISION" >&2
            exit 1
          fi
          git -C "$source_dir" checkout --detach FETCH_HEAD
          actual_revision="$(git -C "$source_dir" rev-parse HEAD)"
          test "$actual_revision" = "$QBE_REVISION"
          printf 'QBE_CHECKED_OUT_HEAD=%s\n' "$actual_revision"
          if ! make -C "$source_dir" -j2 CC=cc; then
            echo "QBE_BUILD_FAILURE: make -C $source_dir -j2 CC=cc" >&2
            exit 1
          fi
          test -x "$source_dir/qbe"
          mkdir -p "$bin_dir"
          ln -s "$source_dir/qbe" "$bin_dir/qbe"
          echo "$bin_dir" >> "$GITHUB_PATH"
          printf 'QBE_BINARY_PATH_TEMPORARY=%s\n' "$source_dir/qbe"

      - name: Install S3 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run required real-QBE native differential corpus
        env:
          S3_QBE_NATIVE_REQUIRED: "1"
        run: python -m pytest -v --tb=short tests/test_qbe_oracle.py

  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run functional benchmark smoke
        run: >-
          python tools/s3bench.py
          --smoke
          --benchmark runtime.scalar.accumulate.v1
          --implementation s3
          --mode emulator
          --optimization O0
          --runner-type shared-ci
          --output-json benchmarks/results/ci-smoke.json
          --output-markdown benchmarks/results/ci-smoke.md

      - name: Validate smoke result contract
        run: >-
          python -m pytest
          tests/test_s3bench_core.py
          tests/test_s3bench_manifest.py
          tests/test_s3bench_corpus.py
          tests/test_s3bench_cross_language.py
          -q
