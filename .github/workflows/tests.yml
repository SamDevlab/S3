name: Tests

on:
  push:
    branches:
      - main
      - review/chatgpt-stage1-f27-compound-while-fix-20260906
    paths:
      - "bootstrap/**"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - "benchmarks/**"
      - "spec/**"
      - "pyproject.toml"
      - "README.md"
      - "docs/ai-capabilities.json"
      - "docs/decisions/**"
      - "docs/diagnostics.md"
      - ".github/workflows/**"
      - "review_snapshot_post_f27_fix/**"
  pull_request:
    paths:
      - "bootstrap/**"
      - "tests/**"
      - "tools/**"
      - "examples/**"
      - "benchmarks/**"
      - "spec/**"
      - "pyproject.toml"
      - "README.md"
      - "docs/ai-capabilities.json"
      - "docs/decisions/**"
      - "docs/diagnostics.md"
      - ".github/workflows/**"

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ssa-per-pass-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify SSA after each optimization pass
        run: >-
          python -m pytest -q
          tests/test_ssa_per_pass_verification.py
          tests/test_differential_correctness_matrix.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            group_name: unit
            group_filter: 'not (renderer or adapter or fixture_output or benchmark or lehmer or prime)'
          - python-version: "3.12"
            group_name: unit
            group_filter: 'not (renderer or adapter or fixture_output or benchmark or lehmer or prime)'
          - python-version: "3.13"
            group_name: unit
            group_filter: 'not (renderer or adapter or fixture_output or benchmark or lehmer or prime)'
          - python-version: "3.13"
            group_name: renderer
            group_filter: 'renderer or adapter or fixture_output'
          - python-version: "3.13"
            group_name: benchmark
            group_filter: 'benchmark or lehmer or prime'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check golden inspect artifacts
        if: matrix.group_name == 'unit'
        run: python tools/golden_inspect.py check

      - name: Run tests
        run: python -m pytest -n auto -v --tb=short -k "${{ matrix.group_filter }}"

  native-x86-64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate native toolchain
        run: |
          uname -m
          cc --version
          as --version
          ld --version
          file --version
          readelf --version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run required native x86-64 tests
        env:
          S3_NATIVE_REQUIRED: "1"
        run: >-
          python -m pytest
          tests/test_native_x86_64_integration.py
          tests/test_instruction_limit_e3.py
          tests/test_external_jsmn_native.py

  numeric-domain-closure:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate native numeric toolchain
        run: |
          uname -m
          cc --version
          as --version
          ld --version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prove M1.32 programmer-visible numeric capability
        env:
          S3_NATIVE_REQUIRED: "1"
        run: >-
          python -m pytest -q
          tests/test_numeric_domains.py
          tests/test_numeric_closure.py
          tests/test_numeric_source_parser.py
          tests/test_numeric_native_integration.py
          tests/test_numeric_capability_e2e.py

  differential-generated:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic differential gate
        run: >-
          python -m pytest -q
          tests/test_deterministic_differential_generation.py
          tests/test_differential_harness.py

  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run functional benchmark smoke
        run: >-
          python tools/s3bench.py
          --smoke
          --benchmark runtime.scalar.accumulate.v1
          --implementation s3
          --mode emulator
          --optimization O0
          --runner-type shared-ci
          --output-json benchmarks/results/ci-smoke.json
          --output-markdown benchmarks/results/ci-smoke.md

      - name: Validate smoke result contract
        run: >-
          python -m pytest
          tests/test_s3bench_core.py
          tests/test_s3bench_manifest.py
          tests/test_s3bench_corpus.py
          tests/test_s3bench_cross_language.py
          -q

  stage1-local-closure-review:
    if: github.event_name == 'push' && github.ref == 'refs/heads/review/chatgpt-stage1-f27-compound-while-fix-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      S3_STAGE1_LOCAL_CLOSURE: "1"
      S3_STAGE1_CANONICAL_PATH: /tmp/s3c_stage1_protected.s3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Materialize protected canonical
        run: |
          git fetch --no-tags --depth=1 origin 1ec76af89992f119865a370488593ad5c85c4c49
          git show 1ec76af89992f119865a370488593ad5c85c4c49:selfhost/compiler/s3c_stage1.s3 > "$S3_STAGE1_CANONICAL_PATH"
          test "$(wc -c < "$S3_STAGE1_CANONICAL_PATH")" -eq 225699
          test "$(sha256sum "$S3_STAGE1_CANONICAL_PATH" | awk '{print $1}')" = "44f022820a9191e3a6d402c188eb4b242e0ffeefd7a149b15e2b46039031b9cb"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Stage1 local closure diagnostics
        id: closure
        shell: bash
        run: |
          set +e
          python -m pytest -vv -s tests/test_stage1_f27_patch_proposal.py tests/test_stage1_local_closure_matrix.py > stage1-local-closure.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat stage1-local-closure.log
          exit 0

      - name: Upload Stage1 local closure log
        uses: actions/upload-artifact@v4
        with:
          name: stage1-local-closure-log
          path: stage1-local-closure.log
          if-no-files-found: error

      - name: Enforce Stage1 local closure result
        run: exit "${{ steps.closure.outputs.exit_code }}"
