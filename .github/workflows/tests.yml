name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest > pytest.log || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull
          cp pytest.log pytest_${{ matrix.python-version }}.log
          git add pytest_${{ matrix.python-version }}.log
          git commit -m "Auto-upload pytest.log" || true
          git push || true
          python -m pytest



  native-x86-64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate native toolchain
        run: |
          uname -m
          cc --version
          as --version
          ld --version
          file --version
          readelf --version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run required native x86-64 tests
        env:
          S3_NATIVE_REQUIRED: "1"
        run: |
          python -m pytest tests/test_native_x86_64_integration.py > pytest.log || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull
          cp pytest.log pytest_native.log
          git add pytest_native.log
          git commit -m "Auto-upload pytest_native.log" || true
          git push || true
          python -m pytest tests/test_native_x86_64_integration.py


