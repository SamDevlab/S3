name: Tests

on:
  push:
  pull_request:

jobs:
  ssa-per-pass-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify SSA after each optimization pass
        run: >-
          python -m pytest -q
          tests/test_ssa_per_pass_verification.py
          tests/test_differential_correctness_matrix.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            group_name: unit
            group_filter: 'not (renderer or adapter or fixture_output or benchmark or lehmer or prime)'
          - python-version: "3.12"
            group_name: unit
            group_filter: 'not (renderer or adapter or fixture_output or benchmark or lehmer or prime)'
          - python-version: "3.13"
            group_name: unit
            group_filter: 'not (renderer or adapter or fixture_output or benchmark or lehmer or prime)'
          - python-version: "3.13"
            group_name: renderer
            group_filter: 'renderer or adapter or fixture_output'
          - python-version: "3.13"
            group_name: benchmark
            group_filter: 'benchmark or lehmer or prime'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check golden inspect artifacts
        if: matrix.group_name == 'unit'
        run: python tools/golden_inspect.py check

      - name: Run tests
        run: python -m pytest -n auto -v --tb=short -k "${{ matrix.group_filter }}"

  native-x86-64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate native toolchain
        run: |
          uname -m
          cc --version
          as --version
          ld --version
          file --version
          readelf --version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run required native x86-64 tests
        env:
          S3_NATIVE_REQUIRED: "1"
        run: python -m pytest tests/test_native_x86_64_integration.py tests/test_instruction_limit_e3.py

  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run functional benchmark smoke
        run: >-
          python tools/s3bench.py
          --smoke
          --benchmark runtime.scalar.accumulate.v1
          --implementation s3
          --mode emulator
          --optimization O0
          --runner-type shared-ci
          --output-json benchmarks/results/ci-smoke.json
          --output-markdown benchmarks/results/ci-smoke.md

      - name: Validate smoke result contract
        run: >-
          python -m pytest
          tests/test_s3bench_core.py
          tests/test_s3bench_manifest.py
          tests/test_s3bench_corpus.py
          tests/test_s3bench_cross_language.py
          -q
