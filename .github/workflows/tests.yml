name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest > pytest.log || true
          curl -sT pytest.log https://transfer.sh/pytest_${{ matrix.python-version }}.log > url.txt
          echo "### Log URL: $(cat url.txt)" >> $GITHUB_STEP_SUMMARY
          python -m pytest




  native-x86-64:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate native toolchain
        run: |
          uname -m
          cc --version
          as --version
          ld --version
          file --version
          readelf --version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run required native x86-64 tests
        env:
          S3_NATIVE_REQUIRED: "1"
        run: |
          python -m pytest tests/test_native_x86_64_integration.py > pytest.log || true
          curl -sT pytest.log https://transfer.sh/pytest_native.log > url.txt
          echo "### Log URL: $(cat url.txt)" >> $GITHUB_STEP_SUMMARY
          python -m pytest tests/test_native_x86_64_integration.py



