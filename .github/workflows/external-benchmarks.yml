name: External Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install repository development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate external benchmark harness
        run: python -m pytest -q external-benchmarks/tests

      - name: Validate scenario discovery
        run: python tools/external_bench.py --list
