name: M1.32 closure apply

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/_closure_132_apply.py
      - tools/_closure_132_apply_v2.py
      - .github/workflows/closure-132-apply.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/closure-1.32-numeric-20260810-1705
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Apply guarded capability patch
        run: python tools/_closure_132_apply_v2.py
      - name: Compile check
        run: python -m compileall -q bootstrap tests
      - name: Focused numeric closure tests
        env:
          S3_NATIVE_REQUIRED: '1'
        run: |
          python -m pytest -q \
            tests/test_numeric_domains.py \
            tests/test_numeric_closure.py \
            tests/test_numeric_source_parser.py \
            tests/test_numeric_native_integration.py \
            tests/test_numeric_capability_e2e.py
      - name: Diff check
        run: git diff --check
      - name: Commit capability closure implementation
        run: |
          rm tools/_closure_132_apply.py tools/_closure_132_apply_v2.py .github/workflows/closure-132-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(1.32): close numeric source and native semantics'
          git push origin HEAD:production/closure-1.32-numeric-20260810-1705
